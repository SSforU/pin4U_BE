spring:
  application:
    name: pin4U
  cache:
    type: caffeine
  profiles:
    default:
  jpa:
    properties:
      hibernate:
        # @OneToMany/@ManyToOne 연관관계가 없는 현재 구조에서는 실질 효과 없음.
        # 향후 연관관계 추가 시 활성화.
        # default_batch_fetch_size: 100
  datasource:
    hikari:
      maximum-pool-size: 30          # db.t3.micro max_connections ≈ 85, 인스턴스 1대 기준 30이면 안전
      minimum-idle: 10               # 유휴 시 최소 커넥션 유지
      connection-timeout: 3000       # 3초 내 획득 실패 시 예외
      idle-timeout: 600000           # 10분 유휴 후 반환
      max-lifetime: 1740000          # 29분 (RDS wait_timeout=30분보다 짧게 → 서버 측 강제 종료 방지)
      leak-detection-threshold: 10000 # 10초 이상 반환 안 하면 경고 로그

springdoc:
  use-fqn: true
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
    urls:
      - name: pin4u
        url: /v3/api-docs

app:
  auth:
    hmac-secret: ${AUTH_HMAC_SECRET:local-dev-only-secret-do-not-use-in-production!!}
  s3:
    bucket: ss4u-pin4u-bucket
    region: ap-northeast-2
    public-prefix: public/
    endpoint: "https://ss4u-pin4u-bucket.s3.ap-northeast-2.amazonaws.com"
  cookies:
    crossSite: true
    domain: ""
  kakao:
    enabled: ${APP_KAKAO_ENABLED:true}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    api:
      base-url: https://dapi.kakao.com
  seed:
    enabled: false
  og:
    image-enabled: false
  summary:
    ttl-days: 7
  http:
    kakao-search:
      connect-timeout: 2s
      response-timeout: 3s
    kakao-oauth:
      connect-timeout: 2s
      response-timeout: 3s
    openai:
      connect-timeout: 2s
      response-timeout: 20s
  ai:
    enabled: ${APP_AI_ENABLED:true}
    openai:
      base-url: https://api.openai.com/v1
      model: ${OPENAI_MODEL:gpt-4o-mini}
      api-key: ${OPENAI_API_KEY:}

server:
  forward-headers-strategy: framework
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

resilience4j:
  circuitbreaker:
    instances:
      kakaoSearch:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20          # 최근 20회 호출 기준으로 실패율 계산
        failure-rate-threshold: 50       # 50% 실패 시 OPEN
        wait-duration-in-open-state: 30s # OPEN 후 30초 대기 후 HALF_OPEN 전이
        permitted-number-of-calls-in-half-open-state: 5
      openai:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10          # AI 호출은 빈도가 낮으므로 작은 윈도우
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s # OpenAI 장애는 복구에 시간 소요
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      kakaoSearch:
        max-attempts: 3
        wait-duration: 300ms
      openai:
        max-attempts: 2
        wait-duration: 1s
  bulkhead:
    instances:
      openai:
        max-concurrent-calls: 10         # Hikari pool(30) 대비 AI 동시 호출 제한

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    circuitbreakers:
      enabled: true