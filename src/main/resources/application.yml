spring:
  application:
    name: pin4U
  profiles:
    default:
  # [Theme 1] JPA Performance Optimization
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
  datasource:
    hikari:
      maximum-pool-size: 30  # 서버 내부 병목 제거

springdoc:
  use-fqn: true
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
    urls:
      - name: pin4u
        url: /v3/api-docs

app:
  auth:
    hmac-secret: ${AUTH_HMAC_SECRET:local-dev-only-secret-do-not-use-in-production!!}
  s3:
    bucket: ss4u-pin4u-bucket
    region: ap-northeast-2
    public-prefix: public/
    endpoint: "https://ss4u-pin4u-bucket.s3.ap-northeast-2.amazonaws.com"
  cookies:
    crossSite: true
    domain: ""
  kakao:
    enabled: ${APP_KAKAO_ENABLED:true}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    api:
      base-url: https://dapi.kakao.com
  seed:
    enabled: false
  og:
    image-enabled: false
  summary:
    ttl-days: 7
  http:
    kakao-search:
      connect-timeout: 2s
      response-timeout: 3s
    kakao-oauth:
      connect-timeout: 2s
      response-timeout: 3s
    openai:
      connect-timeout: 2s
      response-timeout: 20s
  ai:
    enabled: ${APP_AI_ENABLED:true}
    openai:
      base-url: https://api.openai.com/v1
      model: ${OPENAI_MODEL:gpt-4o-mini}
      api-key: ${OPENAI_API_KEY:}

server:
  forward-headers-strategy: framework
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

resilience4j:
  circuitbreaker:
    instances:
      kakaoSearch:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20          # 최근 20회 호출 기준으로 실패율 계산
        failure-rate-threshold: 50       # 50% 실패 시 OPEN
        wait-duration-in-open-state: 30s # OPEN 후 30초 대기 후 HALF_OPEN 전이
        permitted-number-of-calls-in-half-open-state: 5
      openai:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10          # AI 호출은 빈도가 낮으므로 작은 윈도우
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s # OpenAI 장애는 복구에 시간 소요
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      kakaoSearch:
        max-attempts: 3
        wait-duration: 300ms
      openai:
        max-attempts: 2
        wait-duration: 1s
  bulkhead:
    instances:
      openai:
        max-concurrent-calls: 10         # Hikari pool(30) 대비 AI 동시 호출 제한

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    circuitbreakers:
      enabled: true