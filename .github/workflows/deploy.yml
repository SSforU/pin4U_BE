name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: backend-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 배포 게이트: DEPLOY_ENABLED 변수가 'true'이거나 수동 실행(workflow_dispatch)일 때만 동작.
    # 레포지토리 Settings > Variables에서 DEPLOY_ENABLED를 설정하지 않으면 자동 배포 비활성화.
    # 배포하고 싶을 때: (1) 변수를 'true'로 설정하거나 (2) Actions에서 수동 실행.
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy to EC2 using SSM
        run: |
          RDS_ENDPOINT="$(printf '%s' '${{ secrets.RDS_ENDPOINT }}' | tr -d '\r\n')"
          RDS_PASSWORD="$(printf '%s' '${{ secrets.RDS_PASSWORD }}' | tr -d '\r\n')"
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          DB_URL="jdbc:postgresql://${RDS_ENDPOINT}/pin4u_be"

          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"docker stop pin4u-app || true\",
              \"docker rm pin4u-app || true\",
              \"aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}\",
              \"docker run -d --name pin4u-app -p 8080:8080 \
                -e JAVA_OPTS=-Xmx384m \
                -e SPRING_PROFILES_ACTIVE=prod \
                -e SPRING_DATASOURCE_URL=\\\"${DB_URL}\\\" \
                -e SPRING_DATASOURCE_USERNAME=\\\"pin4u\\\" \
                -e SPRING_DATASOURCE_PASSWORD=\\\"${RDS_PASSWORD}\\\" \
                -e AUTH_HMAC_SECRET=\\\"${{ secrets.AUTH_HMAC_SECRET }}\\\" \
                -e APP_KAKAO_ENABLED=false \
                -e APP_AI_ENABLED=false \
                ${IMAGE}\"
            ]"
